name: Fiyat Kontrolü

on:
  schedule:
    # Her 3 saatte bir otomatik çalışır (UTC saatine göre)
    - cron: '0 */3 * * *'
  workflow_dispatch: # İstediğin zaman manuel olarak da çalıştırma butonu sağlar

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Fiyat hafızasını kaydedebilmesi için yazma izni

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Kur
        run: |
          pip install playwright requests
          playwright install chromium

      - name: Fiyatları Kontrol Et
        run: python tracker.py

      - name: Güncel Fiyatları Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fiyatlar.json
          git commit -m "Fiyat hafızası güncellendi" || echo "Fiyat değişikliği yok"
          git push
