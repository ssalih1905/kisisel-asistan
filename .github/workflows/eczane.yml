name: Gunluk Nobetci Eczane Guncelle

on:
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tarayici Bilesenlerini Kur
        run: |
          pip install playwright
          playwright install chromium
      - name: Eczaneleri Cek
        run: python eczane_guncelle.py
      - name: GitHuba Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add eczaneler.json
          git commit -m "Nobetci eczaneler guncellendi" || exit 0
          git push
