name: Gunluk Nobetci Eczane Guncelle

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Eczane Verisini Çek
        run: python eczane_guncelle.py

      - name: GitHub'a Kaydet
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add eczaneler.json
          git commit -m "Eczane listesi güncellendi" || echo "Değişiklik yok"
          git push
